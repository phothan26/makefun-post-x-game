<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Catcher — one prompt, one game</title>
<style>
  html,body{margin:0;padding:0;background:#070512;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// STAR CATCHER — built from one prompt:
// "Build a tiny browser game: a neon basket catches falling stars.
//  Move with mouse or arrow keys, catch stars for points, avoid
//  falling bombs, 60-second timer, score and best score on a
//  game-over screen. Bright neon style on a dark sky, stars twinkle."
//
// Deterministic: one seeded RNG drives every spawn, so the same
// seed always plays the same game. ?seed=, ?t= seconds, ?autoplay=1
// (a demo bot steers the basket) are read from the URL.

const params = new URLSearchParams(location.search);
const SEED = Number(params.get('seed') || 1337);
const GAME_SECONDS = Number(params.get('t') || 60);
const AUTOPLAY = params.get('autoplay') === '1';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

const rng = mulberry32(SEED);
const rand = (a, b) => a + rng() * (b - a);

// Twinkling background stars, fixed at load.
const bgStars = Array.from({ length: 140 }, () => ({
  x: rng(), y: rng(), r: rand(0.6, 2.2), p: rand(0, Math.PI * 2), s: rand(0.5, 2)
}));

const basket = { x: 0.5, w: 150, h: 26, speed: 0 };
const keys = {};
let mouseX = null;
addEventListener('keydown', e => { keys[e.key] = true; });
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('mousemove', e => { mouseX = e.clientX / W; });

const items = [];   // falling stars and bombs
const pops = [];    // floating "+10" score popups
let score = 0, lives = 3, caught = 0, dodged = 0;
let timeLeft = GAME_SECONDS, elapsed = 0;
let state = 'title'; // title -> playing -> over
let titleT = 0, overT = 0, spawnT = 0, flash = 0;
let best = 0;
try { best = Number(localStorage.getItem('star-catcher-best') || 0); } catch (e) {}

function spawn() {
  const bomb = rng() < 0.22;
  items.push({
    kind: bomb ? 'bomb' : 'star',
    x: rand(0.05, 0.95), y: -0.05,
    vy: rand(0.22, 0.38) * (bomb ? 1.15 : 1),
    vx: rand(-0.03, 0.03),
    r: bomb ? 26 : rand(16, 24),
    rot: rand(0, Math.PI * 2), vr: rand(-2, 2),
    hue: bomb ? 0 : rand(40, 55)
  });
}

function drawStar(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.shadowColor = color; ctx.shadowBlur = 24;
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function drawBomb(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#1a1a22';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#ff2d55'; ctx.stroke();
  ctx.fillStyle = '#ff2d55';
  ctx.fillRect(-r * 0.55, -4, r * 1.1, 8);
  ctx.fillRect(-4, -r * 0.55, 8, r * 1.1);
  ctx.restore();
}

function drawBasket() {
  const bx = basket.x * W, by = H - 70;
  ctx.save();
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 26;
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath();
  ctx.moveTo(bx - basket.w / 2, by);
  ctx.lineTo(bx + basket.w / 2, by);
  ctx.lineTo(bx + basket.w / 2 - 18, by + basket.h);
  ctx.lineTo(bx - basket.w / 2 + 18, by + basket.h);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#070512';
  ctx.fillRect(bx - basket.w / 2 + 12, by + 8, 10, basket.h - 14);
  ctx.fillRect(bx - basket.w / 2 + 34, by + 8, 10, basket.h - 14);
  ctx.fillRect(bx + basket.w / 2 - 44, by + 8, 10, basket.h - 14);
  ctx.fillRect(bx + basket.w / 2 - 22, by + 8, 10, basket.h - 14);
  ctx.restore();
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '700 44px system-ui, sans-serif';
  ctx.shadowColor = '#ffd60a'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffd60a';
  ctx.fillText('SCORE ' + score, 36, 28);
  ctx.shadowColor = '#00e5ff'; ctx.fillStyle = '#00e5ff';
  ctx.textAlign = 'right';
  ctx.fillText('TIME ' + Math.ceil(timeLeft) + 's', W - 36, 28);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2d55'; ctx.shadowColor = '#ff2d55';
  ctx.fillText('♥'.repeat(Math.max(0, lives)), W / 2, 28);
  ctx.shadowBlur = 0;
}

function drawTitle(t) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pulse = 0.7 + 0.3 * Math.sin(t * 3);
  ctx.font = '900 110px system-ui, sans-serif';
  ctx.shadowColor = '#c41c83'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('STAR CATCHER', W / 2, H * 0.32);
  ctx.font = '600 40px system-ui, sans-serif';
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#00e5ff';
  ctx.fillText('catch the stars · dodge the bombs', W / 2, H * 0.45);
  ctx.globalAlpha = pulse;
  ctx.font = '700 34px system-ui, sans-serif';
  ctx.fillStyle = '#ffd60a'; ctx.shadowColor = '#ffd60a';
  ctx.fillText(AUTOPLAY ? '▶ WATCH IT PLAY' : 'CLICK OR PRESS SPACE TO PLAY', W / 2, H * 0.62);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawOver() {
  ctx.fillStyle = 'rgba(7,5,18,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 100px system-ui, sans-serif';
  ctx.shadowColor = '#c41c83'; ctx.shadowBlur = 36;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('TIME UP!', W / 2, H * 0.34);
  ctx.font = '700 64px system-ui, sans-serif';
  ctx.shadowColor = '#ffd60a'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffd60a';
  ctx.fillText('SCORE  ' + score, W / 2, H * 0.5);
  ctx.font = '600 36px system-ui, sans-serif';
  ctx.shadowColor = '#00e5ff'; ctx.fillStyle = '#00e5ff';
  ctx.fillText('stars caught: ' + caught + '   ·   best: ' + Math.max(best, score), W / 2, H * 0.62);
}

function step(dt) {
  // Background.
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0620'); g.addColorStop(0.6, '#070512'); g.addColorStop(1, '#160a2e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const now = performance.now() / 1000;
  for (const s of bgStars) {
    ctx.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now * s.s + s.p));
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state === 'title') {
    titleT += dt;
    drawTitle(titleT);
    if (AUTOPLAY && titleT > 1.2) state = 'playing';
    return;
  }
  if (state === 'over') {
    overT += dt;
    drawOver();
    return;
  }

  // Playing.
  elapsed += dt; timeLeft = Math.max(0, GAME_SECONDS - elapsed);
  spawnT += dt;
  if (spawnT > 0.55) { spawnT = 0; spawn(); }

  // Steer the basket.
  let target = basket.x;
  if (AUTOPLAY) {
    let bestItem = null, bestY = -1;
    for (const it of items) {
      if (it.kind === 'star' && it.y > bestY) { bestY = it.y; bestItem = it; }
    }
    if (bestItem) target = bestItem.x;
  } else if (mouseX !== null) target = mouseX;
  if (keys['ArrowLeft']) target = basket.x - 0.02;
  if (keys['ArrowRight']) target = basket.x + 0.02;
  basket.x += (target - basket.x) * Math.min(1, dt * 14);
  basket.x = Math.max(basket.w / 2 / W, Math.min(1 - basket.w / 2 / W, basket.x));

  const by = H - 70, bx = basket.x * W;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt; it.x += it.vx * dt; it.rot += it.vr * dt;
    if (it.kind === 'star') drawStar(it.x * W, it.y * H, it.r, it.rot, '#ffd60a');
    else drawBomb(it.x * W, it.y * H, it.r, it.rot);
    // Caught?
    if (it.y * H > by - 10 && it.y * H < by + basket.h + 14 &&
        Math.abs(it.x * W - bx) < basket.w / 2 + it.r * 0.6) {
      if (it.kind === 'star') {
        score += 10; caught++;
        pops.push({ x: it.x * W, y: it.y * H, t: 0, txt: '+10' });
      } else { score = Math.max(0, score - 15); lives--; flash = 0.35; }
      items.splice(i, 1); continue;
    }
    if (it.y > 1.08) { if (it.kind === 'star') dodged++; items.splice(i, 1); }
  }

  // Floating score popups.
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 40px system-ui, sans-serif';
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += dt;
    if (p.t > 0.9) { pops.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.shadowColor = '#ffd60a'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd60a';
    ctx.fillText(p.txt, p.x, p.y - p.t * 70);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  if (flash > 0) {
    flash -= dt;
    ctx.fillStyle = 'rgba(255,45,85,' + Math.max(0, flash) * 0.55 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawBasket();
  drawHUD();
  if (timeLeft <= 0 || lives <= 0) {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('star-catcher-best', String(best)); } catch (e) {} }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('pointerdown', () => { if (state === 'title') state = 'playing'; });
addEventListener('keydown', e => { if (e.code === 'Space' && state === 'title') state = 'playing'; });

// Readable state for the capture harness.
window.__game = {
  get state() { return state; },
  get score() { return score; },
  get timeLeft() { return timeLeft; },
  get caught() { return caught; }
};
</script>
</body>
</html>
